name: CI

on:
  push:
    branches: [main, upgrade-pass]
  pull_request:
    branches: [main, upgrade-pass]

env:
  # Auth.js only needs AUTH_SECRET to be present, not valid, to build.
  # DATABASE_URL points at the postgres service container below — the
  # build now runs `prisma migrate deploy`, which needs a real reachable
  # database, not just a well-formed connection string.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-build-secret-not-for-production-use-only"
  NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
